<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoachFlow - Plataforma para Coaches</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="data:,">
</head>
<body class="bg-gray-50">
  <div id="app">
    <!-- Conteúdo será carregado dinamicamente -->
    <div id="loading" class="flex items-center justify-center h-screen">
      <div class="animate-spin rounded-full h-32 w-32 border-t-2 border-b-2 border-blue-500"></div>
    </div>
  </div>

  <!-- Scripts de bibliotecas externas -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <script>
    // Garantir que as bibliotecas estão disponíveis globalmente
    window.Chart = Chart;
    window.emailjs = emailjs;
  </script>
  
  <!-- Configuração e utilitários -->
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  
  <!-- Componentes UI -->
  <script src="js/components/ui/chart.js"></script>
  
  <!-- Serviços -->
  <script src="js/services/auth.js"></script>
  <script src="js/services/coaches.js"></script>
  <script src="js/services/clients.js"></script>
  <script src="js/services/sessions.js"></script>
  <script src="js/services/feedback.js"></script>
  <script src="js/services/notifications.js"></script>
  
  <!-- Componentes -->
  <script src="js/components/navbar.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/clientCard.js"></script>
  <script src="js/components/sessionCard.js"></script>
  <script src="js/components/progressChart.js"></script>
  <script src="js/components/upgradeModal.js"></script>
  
  <!-- Páginas -->
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/clients.js"></script>
  <script src="js/pages/sessions.js"></script>
  <script src="js/pages/feedback.js"></script>
  <script src="js/pages/profile.js"></script>
  
  <!-- App principal -->
  <script src="js/app.js"></script>
</body>
</html>
